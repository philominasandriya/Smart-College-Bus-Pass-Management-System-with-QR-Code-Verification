<!DOCTYPE html>
<html lang="en">

</head>
<body class="bg-[#F8F5F0] font-sans m-0 p-0 min-h-screen flex flex-col justify-between">

    <!-- Header with Emblem on Left and Home Button on Right -->

        <!-- Emblem / Logo on Left -->
        <div class="flex items-center space-x-3">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="Emblem.jpg" alt="SNGCE Emblem" class="h-10 w-auto object-contain">
                <span class="text-white font-bold text-sm tracking-wider hidden sm:inline">SNGCE BUS PASS</span>
            </a>
        </div>

        <!-- Home Button on Right -->
        <a href="index.html" class="border border-white/40 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-white hover:text-[#1A2E6B] transition shadow-sm">
            Home
        </a>
    </header>

    <!-- Main Content Area with Centered Login Card -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-xl border border-[#1A2E6B]/20">
            
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-[#1A2E6B]">Login</h1>
                <p class="text-gray-500 text-xs tracking-wider uppercase mt-1">Smart College Bus Pass Management System</p>
            </div>
            
            <form action="login_process.php" method="POST" class="space-y-5">
                
                <!-- Username Field -->
                <div>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-gray-400">
                            <i class="fa-regular fa-user"></i>
                        </span>
                        <input type="text" id="username" name="username" required 
                            placeholder="Username" 
                            class="w-full pl-11 pr-4 py-3 bg-[#F8F5F0] border border-gray-300 rounded-lg text-gray-800 placeholder-gray-400 focus:outline-none focus:border-[#1A2E6B] focus:ring-1 focus:ring-[#1A2E6B] transition text-sm">
                    </div>
                </div>

                <!-- Password Field with Toggle Eye -->
                <div>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-gray-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" name="password" required 
                            placeholder="Password" 
                            class="w-full pl-11 pr-12 py-3 bg-[#F8F5F0] border border-gray-300 rounded-lg text-gray-800 placeholder-gray-400 focus:outline-none focus:border-[#1A2E6B] focus:ring-1 focus:ring-[#1A2E6B] transition text-sm">
                        <button type="button" onclick="togglePassword()" class="absolute right-4 text-gray-400 hover:text-[#1A2E6B] focus:outline-none">
                            <i id="eyeIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

              <!-- Forgot Password Link -->
<div class="flex justify-end">
    <a href="forgot_password.php" class="text-xs text-[#1A2E6B] hover:underline font-medium">Forgot Password?</a>
</div>

               <!-- Login Button (Centered & Small) -->
                <div class="pt-4 flex justify-center">
                    <button type="submit" class="bg-[#1A2E6B] text-white px-6 py-2 rounded-lg font-semibold hover:bg-[#142353] transition shadow-md text-xs tracking-wide">
                        Login
                    </button>
                </div>

                <!-- Divider -->
                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase">or</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <!-- Register Button -->
                <div class="pt-4 flex justify-center">
                    <a href="Reg.html" class="inline-block text-center bg-transparent border-2 border-[#1A2E6B] text-[#1A2E6B] px-6 py-2 rounded-lg font-semibold hover:bg-[#1A2E6B] hover:text-white transition text-xs tracking-wide">
                        Register New Account
                    </a>
                </div>

            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-[#1A2E6B] text-white text-center py-4 text-xs tracking-wide">
        &copy; 2026 Smart College Bus Pass Management System. All Rights Reserved.
    </footer>

    <!-- JavaScript for Toggle Password Visibility -->
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
